# Breakout: EfficientZero reaches a decent score in ~100k steps; REINFORCE needs ~10M for a
# comparable score, so budget the REINFORCE run accordingly (or stop it earlier and say so).
_base_: base.yaml

env:
  game: Breakout

ez:
  total_env_steps: 120000
  checkpoints: [20000, 50000, 100000]

# dqn:
#   total_env_steps: 5000000
#   exploration_steps: 1000000
#   checkpoints: [20000, 50000, 100000, 1000000, 3000000, 5000000]

reinforce:
  total_env_steps: 5000000
  checkpoints: [20000, 50000, 100000, 1000000, 3000000, 5000000]

demo:
  reinforce_converged_step: 5000000
  # dqn_converged_step: 5000000
  pairs:
    - name: early-learning
      ez_step: 20000
      reinforce_step: 20000
      # dqn_step: 20000
      note: "20k env steps: EfficientZero has learned to aim, REINFORCE flails"
    - name: mid-training
      ez_step: 50000
      reinforce_step: 50000
      # dqn_step: 50000
      note: "50k env steps: EfficientZero clears rows, REINFORCE scores by accident"
    - name: efficientzero-converged
      ez_step: 100000
      reinforce_step: 100000
      # dqn_step: 100000
      note: "100k env steps: EfficientZero tunnels through the wall, REINFORCE is still warming up"
